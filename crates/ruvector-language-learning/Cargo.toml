[package]
name = "ruvector-language-learning"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Bounded SONA advisory strategy learning with immutable RuGraph evaluation"
repository = "https://github.com/ruvnet/ruGraph"
[workspace]
[dependencies]
ruvector-language = { path = "../ruvector-language" }
ruvector-sona = { git = "https://github.com/ruvnet/RuVector.git", rev = "f017d5f10c78b95843614f040f5cf22bfc1b3ac8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ruvector-language-rvf = { path = "../ruvector-language-rvf" }
