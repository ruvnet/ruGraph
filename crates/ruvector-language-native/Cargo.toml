[package]
name = "ruvector-language-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Real RuVector graph and KGE adapters for the RuGraph language"
repository = "https://github.com/ruvnet/ruGraph"

[workspace]

[dependencies]
ruvector-language = { path = "../ruvector-language" }
ruvector-graph = { git = "https://github.com/ruvnet/RuVector.git", rev = "f017d5f10c78b95843614f040f5cf22bfc1b3ac8", default-features = false }
ruvector-kge = { git = "https://github.com/ruvnet/RuVector.git", rev = "f017d5f10c78b95843614f040f5cf22bfc1b3ac8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "rvg"
path = "src/main.rs"

[[bin]]
name = "rvg-model"
path = "src/model_main.rs"
