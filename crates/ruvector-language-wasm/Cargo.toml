[package]
name = "ruvector-language-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "RuGraph deterministic browser and Node WebAssembly runtime"
repository = "https://github.com/ruvnet/ruGraph"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ruvector-language = { path = "../ruvector-language" }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.105"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
