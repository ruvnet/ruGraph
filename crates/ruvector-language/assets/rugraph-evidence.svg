<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title desc">
<title id="title">Four evidence states: supported, refuted, conflicting, unknown</title>
<desc id="desc">Supported means positive only, refuted means negative only, conflicting means both signs, and unknown means neither. The four independent cards are categories, not stages or confidence scores.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a30"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#62f5cd"/><stop offset="1" stop-color="#91a7ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#62f5cd" stop-opacity=".12"/><stop offset="1" stop-color="#62f5cd" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca9cf" stroke-opacity=".035"/></pattern>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#58738f" stroke-width="1.3"/></marker>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
 .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
 .flow{stroke-dasharray:7 24;animation:flow 6s linear infinite}
 .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
 .highlight{animation:highlight 9s ease-in-out infinite}
 .scan{stroke-dasharray:170 710;animation:scan 9s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-186}}
 @keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes highlight{0%,30%,100%{stroke-opacity:.35}10%,22%{stroke-opacity:1}}
 @keyframes scan{to{stroke-dashoffset:-880}}
 @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.highlight,.scan{animation:none;transform:none}}
</style>
<rect width="1200" height="486" rx="24" fill="url(#bg)"/>
<rect width="1200" height="486" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="484" rx="23" fill="none" stroke="#2a3a53"/>
<circle cx="42" cy="34" r="4" fill="#62f5cd" /><text x="56" y="39" font-size="15" font-weight="500" fill="#a4b6cc" letter-spacing="1.5">02 / EVIDENCE</text><text x="38" y="88" font-size="34" font-weight="650" fill="#edf5ff" >Unknown is a result. Conflict is visible.</text><text x="40" y="119" font-size="18" font-weight="400" fill="#a4b6cc" >Track positive and negative support independently for each claim.</text><rect x="40" y="152" width="540" height="118" rx="18" fill="#101e31" stroke="#62f5cd" class="highlight" style="animation-delay:0s"/><circle cx="97" cy="210" r="32" fill="#62f5cd" opacity=".08" class="pulse"/><text x="97" y="220" font-size="27" font-weight="700" fill="#62f5cd" text-anchor="middle">+</text><text x="150" y="200" font-size="27" font-weight="650" fill="#62f5cd" >supported</text><text x="150" y="235" font-size="19" font-weight="400" fill="#a4b6cc" >Positive support only</text><rect x="620" y="152" width="540" height="118" rx="18" fill="#101e31" stroke="#ff91a4" class="highlight" style="animation-delay:-2.25s"/><circle cx="677" cy="210" r="32" fill="#ff91a4" opacity=".08" class="pulse"/><text x="677" y="220" font-size="27" font-weight="700" fill="#ff91a4" text-anchor="middle">−</text><text x="730" y="200" font-size="27" font-weight="650" fill="#ff91a4" >refuted</text><text x="730" y="235" font-size="19" font-weight="400" fill="#a4b6cc" >Negative support only</text><rect x="40" y="294" width="540" height="118" rx="18" fill="#101e31" stroke="#ffd28a" class="highlight" style="animation-delay:-4.5s"/><circle cx="97" cy="352" r="32" fill="#ffd28a" opacity=".08" class="pulse"/><text x="97" y="362" font-size="27" font-weight="700" fill="#ffd28a" text-anchor="middle">+  −</text><text x="150" y="342" font-size="27" font-weight="650" fill="#ffd28a" >conflicting</text><text x="150" y="377" font-size="19" font-weight="400" fill="#a4b6cc" >Both signs have support</text><rect x="620" y="294" width="540" height="118" rx="18" fill="#101e31" stroke="#91a7ff" class="highlight" style="animation-delay:-6.75s"/><circle cx="677" cy="352" r="32" fill="#91a7ff" opacity=".08" class="pulse"/><text x="677" y="362" font-size="27" font-weight="700" fill="#91a7ff" text-anchor="middle">?</text><text x="730" y="342" font-size="27" font-weight="650" fill="#91a7ff" >unknown</text><text x="730" y="377" font-size="19" font-weight="400" fill="#a4b6cc" >Neither sign has support</text><text x="40" y="454" font-size="18" font-weight="400" fill="#a4b6cc" >Missing evidence does not mean false. Learned scores remain separate from observed evidence.</text>
</svg>
