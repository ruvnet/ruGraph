<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">RuGraph: give AI decisions an evidence trail</title>
<desc id="desc">A spatial graph connects relationships, vectors, signed evidence, and separately typed model predictions to the RuGraph runtime. Bounded programs produce traceable, replayable output.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a30"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#62f5cd"/><stop offset="1" stop-color="#91a7ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#62f5cd" stop-opacity=".12"/><stop offset="1" stop-color="#62f5cd" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca9cf" stroke-opacity=".035"/></pattern>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#58738f" stroke-width="1.3"/></marker>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
 .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
 .flow{stroke-dasharray:7 24;animation:flow 6s linear infinite}
 .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
 .highlight{animation:highlight 9s ease-in-out infinite}
 .scan{stroke-dasharray:170 710;animation:scan 9s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-186}}
 @keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes highlight{0%,30%,100%{stroke-opacity:.35}10%,22%{stroke-opacity:1}}
 @keyframes scan{to{stroke-dashoffset:-880}}
 @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.highlight,.scan{animation:none;transform:none}}
</style>
<rect width="1200" height="490" rx="24" fill="url(#bg)"/>
<rect width="1200" height="490" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="488" rx="23" fill="none" stroke="#2a3a53"/>
<circle cx="50" cy="48" r="4" fill="#62f5cd" /><text x="64" y="53" font-size="15" font-weight="500" fill="#a4b6cc" letter-spacing="1.5">RUVECTOR / GRAPH PROGRAMMING</text><text x="45" y="156" font-size="88" font-weight="750" fill="#edf5ff" letter-spacing="-4">RuGraph</text><text x="50" y="211" font-size="34" font-weight="600" fill="#edf5ff" >Give AI decisions</text><text x="50" y="254" font-size="34" font-weight="600" fill="#edf5ff" >an evidence trail.</text><text x="50" y="310" font-size="21" font-weight="400" fill="#a4b6cc" >Query connected data. Reason over evidence.</text><text x="50" y="343" font-size="21" font-weight="400" fill="#a4b6cc" >Inspect what changed. Replay the result.</text><rect x="50" y="389" width="122" height="37" rx="18" fill="#112631" stroke="#62f5cd" /><text x="111.0" y="414" font-size="14" font-weight="650" fill="#62f5cd" text-anchor="middle" letter-spacing="1">BOUNDED</text><rect x="184" y="389" width="150" height="37" rx="18" fill="#112631" stroke="#91a7ff" /><text x="259.0" y="414" font-size="14" font-weight="650" fill="#91a7ff" text-anchor="middle" letter-spacing="1">TRACEABLE</text><rect x="346" y="389" width="158" height="37" rx="18" fill="#112631" stroke="#62f5cd" /><text x="425.0" y="414" font-size="14" font-weight="650" fill="#62f5cd" text-anchor="middle" letter-spacing="1">REPLAYABLE</text><circle cx="881" cy="236" r="250" fill="url(#halo)"/><g transform="translate(880 237)"><ellipse rx="218" ry="139" fill="none" stroke="#2a4059" transform="rotate(-28)"/><ellipse rx="218" ry="139" fill="none" stroke="#2a4059" transform="rotate(28)"/></g><circle cx="880" cy="237" r="180" fill="none" stroke="#62f5cd" stroke-opacity=".15" stroke-dasharray="2 17" class="orbit"/><path d="M695 154L879 238L1064 149" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M695 154L879 238L1064 149" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:0s"/><path d="M732 356L879 238L1082 321" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M732 356L879 238L1082 321" fill="none" stroke="#91a7ff" stroke-width="2" class="flow" style="animation-delay:-2s"/><path d="M929 72L879 238L930 411" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M929 72L879 238L930 411" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:-4s"/><circle cx="695" cy="154" r="25" fill="#102638" stroke="#62f5cd" stroke-width="1.6"/><circle cx="695" cy="154" r="6" fill="#62f5cd" class="pulse"/><text x="695" y="202" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="middle">Graph</text><text x="695" y="224" font-size="15" font-weight="400" fill="#a4b6cc" text-anchor="middle">relationships</text><circle cx="1064" cy="149" r="25" fill="#102638" stroke="#91a7ff" stroke-width="1.6"/><circle cx="1064" cy="149" r="6" fill="#91a7ff" class="pulse"/><text x="1064" y="197" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="middle">Vectors</text><text x="1064" y="219" font-size="15" font-weight="400" fill="#a4b6cc" text-anchor="middle">similarity</text><circle cx="732" cy="356" r="25" fill="#102638" stroke="#62f5cd" stroke-width="1.6"/><circle cx="732" cy="356" r="6" fill="#62f5cd" class="pulse"/><text x="732" y="404" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="middle">Evidence</text><text x="732" y="426" font-size="15" font-weight="400" fill="#a4b6cc" text-anchor="middle">signed claims</text><circle cx="1082" cy="321" r="25" fill="#102638" stroke="#ffd28a" stroke-width="1.6"/><circle cx="1082" cy="321" r="6" fill="#ffd28a" class="pulse"/><text x="1082" y="369" font-size="20" font-weight="600" fill="#edf5ff" text-anchor="middle">Models</text><text x="1082" y="391" font-size="15" font-weight="400" fill="#a4b6cc" text-anchor="middle">predictions</text><circle cx="929" cy="72" r="7" fill="#62f5cd" /><circle cx="930" cy="411" r="7" fill="#91a7ff" /><circle cx="879" cy="238" r="65" fill="#62f5cd" opacity=".06" class="pulse"/><circle cx="879" cy="238" r="48" fill="#112b37" stroke="#62f5cd" stroke-width="2"/><text x="879" y="232" font-size="26" font-weight="700" fill="#62f5cd" text-anchor="middle">rvg</text><text x="879" y="255" font-size="13" font-weight="400" fill="#a4b6cc" text-anchor="middle">runtime</text><text x="879" y="456" font-size="13" font-weight="500" fill="#a4b6cc" text-anchor="middle" letter-spacing="1.4">EXPLICIT INPUTS. INSPECTABLE OUTPUTS.</text>
</svg>
