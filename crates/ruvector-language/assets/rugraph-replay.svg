<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Replay: recompute with pinned inputs and compare the complete receipt</title>
<desc id="desc">Pinned inputs feed a new execution, whose complete receipt is compared with the original. Replay needs the same language version, model artifact, and compatible floating point behavior. Integrity does not authenticate a source or establish truth.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a30"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#62f5cd"/><stop offset="1" stop-color="#91a7ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#62f5cd" stop-opacity=".12"/><stop offset="1" stop-color="#62f5cd" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca9cf" stroke-opacity=".035"/></pattern>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#58738f" stroke-width="1.3"/></marker>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
 .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
 .flow{stroke-dasharray:7 24;animation:flow 6s linear infinite}
 .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
 .highlight{animation:highlight 9s ease-in-out infinite}
 .scan{stroke-dasharray:170 710;animation:scan 9s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-186}}
 @keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes highlight{0%,30%,100%{stroke-opacity:.35}10%,22%{stroke-opacity:1}}
 @keyframes scan{to{stroke-dashoffset:-880}}
 @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.highlight,.scan{animation:none;transform:none}}
</style>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<rect width="1200" height="460" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#2a3a53"/>
<circle cx="42" cy="34" r="4" fill="#62f5cd" /><text x="56" y="39" font-size="15" font-weight="500" fill="#a4b6cc" letter-spacing="1.5">04 / REPLAY</text><text x="38" y="88" font-size="34" font-weight="650" fill="#edf5ff" >Recompute. Compare. Explain.</text><text x="40" y="119" font-size="18" font-weight="400" fill="#a4b6cc" >Keep the program, snapshot, context, and any model artifact with the receipt.</text><rect x="40" y="171" width="320" height="145" rx="18" fill="#101e31" stroke="#91a7ff" /><text x="62" y="218" font-size="25" font-weight="650" fill="#91a7ff" >Pinned inputs</text><text x="62" y="254" font-size="17" font-weight="400" fill="#a4b6cc" >Same data, clock, grants, and</text><text x="62" y="279" font-size="17" font-weight="400" fill="#a4b6cc" >model.</text><rect x="440" y="171" width="320" height="145" rx="18" fill="#101e31" stroke="#62f5cd" /><text x="462" y="218" font-size="25" font-weight="650" fill="#62f5cd" >Run again</text><text x="462" y="254" font-size="17" font-weight="400" fill="#a4b6cc" >Recompute with a compatible</text><text x="462" y="279" font-size="17" font-weight="400" fill="#a4b6cc" >environment.</text><rect x="840" y="171" width="320" height="145" rx="18" fill="#101e31" stroke="#91a7ff" /><text x="862" y="218" font-size="25" font-weight="650" fill="#91a7ff" >Compare receipt</text><text x="862" y="254" font-size="17" font-weight="400" fill="#a4b6cc" >Require the complete receipt</text><text x="862" y="279" font-size="17" font-weight="400" fill="#a4b6cc" >to match.</text><path d="M360 245H440" fill="none" stroke="#58738f" stroke-width="2" class="" marker-end="url(#arrow)"/><path d="M360 245H440" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M360 245H440" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:0s"/><path d="M760 245H840" fill="none" stroke="#58738f" stroke-width="2" class="" marker-end="url(#arrow)"/><path d="M760 245H840" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M760 245H840" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:0s"/><path d="M1000 316V357H200V316" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M1000 316V357H200V316" fill="none" stroke="#62f5cd" stroke-width="2" class="scan" /><text x="600" y="393" font-size="18" font-weight="400" fill="#a4b6cc" text-anchor="middle">Checksums check integrity. Replay checks execution against the supplied inputs.</text><text x="600" y="426" font-size="18" font-weight="400" fill="#a4b6cc" text-anchor="middle">Neither authenticates sources or proves that observations are true.</text>
</svg>
