<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="title desc">
<title id="title">Walkthrough: from a service graph to a supported decision</title>
<desc id="desc">The api depends on database and cache. Database has an explicit positive Failing observation; cache has an explicit negative one. Traverse retrieves nodes, observe reads evidence, and the named rule supports database Degraded. At time 1100 both observations expire.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#121a30"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#62f5cd"/><stop offset="1" stop-color="#91a7ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#62f5cd" stop-opacity=".12"/><stop offset="1" stop-color="#62f5cd" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca9cf" stroke-opacity=".035"/></pattern>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#58738f" stroke-width="1.3"/></marker>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
 .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
 .flow{stroke-dasharray:7 24;animation:flow 6s linear infinite}
 .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 40s linear infinite}
 .highlight{animation:highlight 9s ease-in-out infinite}
 .scan{stroke-dasharray:170 710;animation:scan 9s linear infinite}
 @keyframes flow{to{stroke-dashoffset:-186}}
 @keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes highlight{0%,30%,100%{stroke-opacity:.35}10%,22%{stroke-opacity:1}}
 @keyframes scan{to{stroke-dashoffset:-880}}
 @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.highlight,.scan{animation:none;transform:none}}
</style>
<rect width="1200" height="708" rx="24" fill="url(#bg)"/>
<rect width="1200" height="708" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="706" rx="23" fill="none" stroke="#2a3a53"/>
<circle cx="42" cy="34" r="4" fill="#62f5cd" /><text x="56" y="39" font-size="15" font-weight="500" fill="#a4b6cc" letter-spacing="1.5">01 / WALKTHROUGH</text><text x="38" y="88" font-size="34" font-weight="650" fill="#edf5ff" >Follow one decision.</text><text x="40" y="119" font-size="18" font-weight="400" fill="#a4b6cc" >A service graph, two observations, and one explicit rule.</text><rect x="40" y="148" width="520" height="300" rx="18" fill="#101e31" stroke="#2a4058" /><rect x="590" y="148" width="570" height="300" rx="18" fill="#101e31" stroke="#2a4058" /><text x="62" y="180" font-size="14" font-weight="650" fill="#a4b6cc" letter-spacing="1.5">THE SNAPSHOT</text><path d="M166 285L341 235" fill="none" stroke="#58738f" stroke-width="2" class="" marker-end="url(#arrow)"/><path d="M166 285L341 235" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M166 285L341 235" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:0s"/><path d="M166 285L341 363" fill="none" stroke="#58738f" stroke-width="2" class="" marker-end="url(#arrow)"/><path d="M166 285L341 363" fill="none" stroke="#304861" stroke-width="2" class="" /><path d="M166 285L341 363" fill="none" stroke="#62f5cd" stroke-width="2" class="flow" style="animation-delay:0s"/><text x="184" y="307" font-size="14" font-weight="400" fill="#a4b6cc" class="mono">DEPENDS_ON</text><rect x="70" y="260" width="96" height="50" rx="14" fill="#12283a" stroke="#91a7ff" /><text x="118.0" y="292" font-size="22" font-weight="600" fill="#91a7ff" text-anchor="middle">api</text><rect x="342" y="207" width="182" height="50" rx="14" fill="#12283a" stroke="#62f5cd" /><text x="433.0" y="239" font-size="22" font-weight="600" fill="#62f5cd" text-anchor="middle">database</text><rect x="342" y="335" width="182" height="50" rx="14" fill="#12283a" stroke="#ff91a4" /><text x="433.0" y="367" font-size="22" font-weight="600" fill="#ff91a4" text-anchor="middle">cache</text><text x="352" y="288" font-size="17" font-weight="400" fill="#62f5cd" class="mono">Failing = true</text><text x="352" y="416" font-size="17" font-weight="400" fill="#ff91a4" class="mono">Failing = false</text><text x="614" y="181" font-size="14" font-weight="650" fill="#a4b6cc" letter-spacing="1.5">THE PROGRAM</text><text x="614" y="222" font-size="20" font-weight="400" fill="#91a7ff" class="mono">traverse service</text><text x="614" y="250" font-size="17" font-weight="400" fill="#a4b6cc" >Follow outgoing dependencies.</text><text x="614" y="302" font-size="20" font-weight="400" fill="#62f5cd" class="mono">observe dependencies &quot;Failing&quot;</text><text x="614" y="330" font-size="17" font-weight="400" fill="#a4b6cc" >Read recent signed observations.</text><text x="614" y="382" font-size="20" font-weight="400" fill="#91a7ff" class="mono">infer [errors] using [...]</text><text x="614" y="410" font-size="17" font-weight="400" fill="#a4b6cc" >Apply the named degradation rule.</text><rect x="40" y="477" width="360" height="167" rx="18" fill="#101e31" stroke="#91a7ff" class="highlight" style="animation-delay:0s"/><circle cx="70" cy="509" r="14" fill="#91a7ff" /><text x="70" y="515" font-size="16" font-weight="750" fill="#07111f" text-anchor="middle">1</text><text x="96" y="517" font-size="23" font-weight="600" fill="#edf5ff" >Retrieve</text><text x="60" y="559" font-size="16" font-weight="400" fill="#a4b6cc" >Start at api. Traverse depth 2.</text><text x="60" y="589" font-size="16" font-weight="400" fill="#a4b6cc" >Seeds remain in the node set.</text><rect x="420" y="477" width="360" height="167" rx="18" fill="#101e31" stroke="#62f5cd" class="highlight" style="animation-delay:-3s"/><circle cx="450" cy="509" r="14" fill="#62f5cd" /><text x="450" y="515" font-size="16" font-weight="750" fill="#07111f" text-anchor="middle">2</text><text x="476" y="517" font-size="23" font-weight="600" fill="#edf5ff" >Derive</text><text x="440" y="559" font-size="16" font-weight="400" fill="#a4b6cc" >Failing = true supports Degraded.</text><text x="440" y="589" font-size="16" font-weight="400" fill="#a4b6cc" >The rule applies to the same subject.</text><rect x="800" y="477" width="360" height="167" rx="18" fill="#101e31" stroke="#91a7ff" class="highlight" style="animation-delay:-6s"/><circle cx="830" cy="509" r="14" fill="#91a7ff" /><text x="830" y="515" font-size="16" font-weight="750" fill="#07111f" text-anchor="middle">3</text><text x="856" y="517" font-size="23" font-weight="600" fill="#edf5ff" >Inspect</text><text x="820" y="559" font-size="16" font-weight="400" fill="#a4b6cc" >database / Degraded: supported</text><text x="820" y="589" font-size="16" font-weight="400" fill="#a4b6cc" >Trace observation, source, and rule.</text><text x="40" y="679" font-size="18" font-weight="400" fill="#a4b6cc" >At time 1100 the observations expire. The next run reports unknown for these claims.</text>
</svg>
